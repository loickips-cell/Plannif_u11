<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b4b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Planinf U11</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#142b4b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142b4b;color:white;padding:22px 18px 18px}header small{color:#a8c4d8}.wrap{max-width:740px;margin:auto;padding:15px 14px 105px}.card{background:white;border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 2px 9px #102a4510}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:white;border:1px solid #dce5ed;border-radius:14px;padding:16px;text-align:left;color:#142b4b;font-size:15px;font-weight:700}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px;margin:8px 0}p,small{line-height:1.5}small,.muted{color:#627487}.tag{display:inline-block;background:#e0f4eb;color:#167453;border-radius:30px;padding:5px 10px;font-size:12px}button,.btn{cursor:pointer;border:0;background:#142b4b;color:white;border-radius:11px;padding:13px 15px;font-size:15px;font-weight:650}button.secondary{background:#e8eff5;color:#142b4b}button.green{background:#20a477}input,textarea,select{width:100%;padding:12px;border:1px solid #cad7e2;border-radius:10px;font:inherit;background:white;color:#142b4b}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:650}textarea{min-height:80px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;border-top:1px solid #dae4ed;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:#64778b;font-size:11px;padding:7px 4px;min-width:18%}nav button.active{color:#087b5b;background:#e7f6ee}nav b{display:block;font-size:20px;margin-bottom:4px}.bar{height:9px;border-radius:12px;background:#e1e8ee;overflow:hidden}.bar span{display:block;height:100%;background:#20a477}.score{display:flex;gap:7px}.score button{flex:1;background:#e8eff5;color:#142b4b}.score button.sel{background:#20a477;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.note{border-left:3px solid #20a477;padding-left:10px}.error{color:#a52c2c}a{color:#087b5b}hr{border:0;border-top:1px solid #e5edf2;margin:16px 0}
</style></head><body><header><div style="max-width:740px;margin:auto"><div style="font-size:24px;font-weight:800">⚽ Planinf U11</div><small>Mon suivi pédagogique · 35 séances</small></div></header><main class="wrap" id="app"></main><nav id="nav"></nav><script>
let sessions=[],tab='accueil',chosen='',draft={};const key='planinf-u11-evals-v1';const get=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};const save=a=>localStorage.setItem(key,JSON.stringify(a));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const taskNames=['Échauffement technique','Exercice technique orienté','Situation','Jeu'];function month(s){let id=s.id;let n=Number(id.replace(/\D/g,''));if(id.startsWith('M'))return 'Motricité';return n<=21?'Septembre':n<=25?'Octobre':n<=31?'Novembre':'Décembre'}function nav(t){tab=t;render();scrollTo(0,0)}function selectSession(id){chosen=id;nav('seances')}function assessment(id){chosen=id;draft={id,date:new Date().toISOString().slice(0,10),presence:'',notes:'',decision:'',ratings:[0,0,0,0],comments:['','','','']};nav('evaluer')}
function card(s){return `<div class="card"><div class="row"><strong>${esc(s.id)}</strong><span class="tag">${esc(month(s))}</span></div><h3>${esc(s.theme||'Thème à vérifier dans le programme')}</h3><small>${esc(s.phase)}</small><p><button onclick="selectSession('${esc(s.id)}')">Voir la fiche</button> <button class="secondary" onclick="assessment('${esc(s.id)}')">Évaluer</button></p></div>`}
function render(){let a=get(),done=new Set(a.map(x=>x.id)).size;document.getElementById('nav').innerHTML=[['accueil','⌂','Accueil'],['seances','▤','Séances'],['evaluer','✓','Évaluer'],['bilans','▥','Bilans'],['donnees','⚙','Données']].map(([k,i,l])=>`<button class="${tab===k?'active':''}" onclick="nav('${k}')"><b>${i}</b>${l}</button>`).join('');let html='';if(tab==='accueil'){html=`<h2>Tableau de bord</h2><div class="grid"><div class="card"><small>Séances disponibles</small><h2>${sessions.length}</h2></div><div class="card"><small>Séances évaluées</small><h2>${done}</h2></div></div><div class="card"><h3>Progression des évaluations</h3><div class="bar"><span style="width:${Math.round(done/Math.max(sessions.length,1)*100)}%"></span></div><p class="muted">${done} sur ${sessions.length} séances</p></div><div class="grid"><button class="tile" onclick="nav('seances')">📖<br>Programmation</button><button class="tile" onclick="nav('evaluer')">📝<br>Évaluer une séance</button><button class="tile" onclick="nav('bilans')">📊<br>Bilans</button><button class="tile" onclick="nav('donnees')">💾<br>Sauvegardes</button></div><div class="card"><h3>Important</h3><p>Les évaluations sont enregistrées sur cet appareil uniquement. Exporte régulièrement une sauvegarde dans Fichiers ou iCloud Drive.</p></div>`}
if(tab==='seances'){let s=sessions.find(x=>x.id===chosen);html=`<h2>Programmation</h2><label>Choisir une séance</label><select onchange="chosen=this.value;render()"><option value="">Toutes les séances</option>${sessions.map(x=>`<option value="${esc(x.id)}" ${chosen===x.id?'selected':''}>${esc(x.id)} — ${esc(x.theme).slice(0,55)}</option>`).join('')}</select>`;if(s){html+=`<div class="card"><span class="tag">${esc(s.id)}</span><h2>${esc(s.theme)}</h2><p>${esc(s.phase)}</p><h3>Quatre procédés</h3>${[0,1,2,3].map(i=>`<p>${i+1}. ${esc(s.tasks[i]||taskNames[i])}</p>`).join('')}<p><a href="programme_reference.pdf#page=${s.page}" target="_blank">Ouvrir la fiche complète et les schémas (page ${s.page})</a></p><button class="green" onclick="assessment('${esc(s.id)}')">Évaluer cette séance</button></div>`}else html+=sessions.map(card).join('')}
if(tab==='evaluer'){let s=sessions.find(x=>x.id===chosen);html=`<h2>Évaluation après séance</h2><label>Séance</label><select onchange="assessment(this.value)"><option value="">Choisir</option>${sessions.map(x=>`<option value="${esc(x.id)}" ${chosen===x.id?'selected':''}>${esc(x.id)} — ${esc(x.theme).slice(0,45)}</option>`).join('')}</select>`;if(s){if(draft.id!==chosen)draft={id:chosen,date:new Date().toISOString().slice(0,10),presence:'',notes:'',decision:'',ratings:[0,0,0,0],comments:['','','','']};html+=`<div class="card"><h3>${esc(s.theme)}</h3><label>Date réelle</label><input type="date" value="${esc(draft.date)}" onchange="draft.date=this.value"><label>Joueurs présents</label><input type="number" min="0" max="30" value="${esc(draft.presence)}" oninput="draft.presence=this.value"></div>`;for(let i=0;i<4;i++)html+=`<div class="card"><h3>${i+1}. ${esc(s.tasks[i]||taskNames[i])}</h3><small>1 difficile · 2 à renforcer · 3 satisfaisant · 4 maîtrisé</small><div class="score" style="margin-top:12px">${[1,2,3,4].map(v=>`<button class="${draft.ratings[i]===v?'sel':''}" onclick="draft.ratings[${i}]=${v};render()">${v}</button>`).join('')}</div><label>Observation sur ce procédé</label><textarea oninput="draft.comments[${i}]=this.value">${esc(draft.comments[i])}</textarea></div>`;html+=`<div class="card"><label>Bilan collectif / motricité / transfert</label><textarea oninput="draft.notes=this.value">${esc(draft.notes)}</textarea><label>Adaptation pour la suite</label><textarea oninput="draft.decision=this.value">${esc(draft.decision)}</textarea><p><button class="green" onclick="store()">Enregistrer l'évaluation</button></p><small>Toutes les notes des quatre procédés sont obligatoires.</small></div>`}}
if(tab==='bilans'){let grouped={};for(let r of a){let d=new Date(r.date+'T12:00:00');if(isNaN(d))continue;let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);let k=d.toISOString().slice(0,10);(grouped[k]??=[]).push(r)}let byTheme={};for(let r of a){let s=sessions.find(x=>x.id===r.id),k=s?.theme||'Thème non renseigné';(byTheme[k]??=[]).push(r)}const summary=(items)=>{let nums=items.flatMap(r=>r.ratings.filter(v=>v>0));return nums.length?(nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(2)+'/4':'Sans note'};html=`<h2>Bilans pédagogiques</h2><p class="muted">Synthèses calculées à partir des évaluations enregistrées. Les cycles sont regroupés provisoirement par thème ; leur découpage exact sera validé à partir de la planification maître.</p><h3>Par semaine</h3>`+ (Object.keys(grouped).length?Object.keys(grouped).sort().reverse().map(k=>`<div class="card"><strong>Semaine du ${k}</strong><p>${grouped[k].length} évaluation(s) · Moyenne ${summary(grouped[k])}</p><small>${grouped[k].map(r=>esc(r.id)).join(', ')}</small><p class="note">${grouped[k].map(r=>esc(r.notes)).filter(Boolean).join(' · ')||'Aucune observation collective'}</p></div>`).join(''):'<div class="card">Aucune évaluation pour le moment.</div>')+`<h3>Par thème (préfiguration des cycles)</h3>`+Object.entries(byTheme).map(([k,v])=>`<div class="card"><strong>${esc(k)}</strong><p>${v.length} évaluation(s) · Moyenne ${summary(v)}</p></div>`).join('')}
if(tab==='donnees'){html=`<h2>Mes données</h2><div class="card"><h3>Sauvegarde manuelle</h3><p>Enregistre régulièrement ton historique hors de Safari.</p><button onclick="exportData()">Exporter mes évaluations (JSON)</button><label>Restaurer une sauvegarde JSON</label><input type="file" accept="application/json,.json" onchange="importData(this.files[0])"><small>La restauration remplace les évaluations actuellement présentes, après confirmation.</small></div><div class="card"><h3>Documents de référence</h3><a href="programme_reference.pdf" target="_blank">Ouvrir le programme U11 PDF</a><p class="muted">La programmation source n'est jamais modifiée par les évaluations.</p></div><div class="card"><h3>Confidentialité</h3><p>Version locale sans compte : ne pas saisir de données sensibles sur les enfants. Pour un accès réellement privé et une synchronisation entre appareils, une authentification et une base sécurisée devront être ajoutées.</p></div>`}
document.getElementById('app').innerHTML=html}
function store(){if(draft.ratings.some(v=>!v)){alert('Note les quatre procédés avant de sauvegarder.');return}let a=get();a.push({...draft,createdAt:new Date().toISOString()});try{save(a);alert('Évaluation enregistrée sur cet appareil.');nav('bilans')}catch(e){alert('Impossible de sauvegarder : stockage indisponible. Exporte tes données si possible.')}}function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),evaluations:get()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='planinf-u11-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function importData(file){if(!file)return;try{let j=JSON.parse(await file.text());if(!Array.isArray(j.evaluations))throw Error('Format invalide');if(confirm('Remplacer toutes les évaluations locales par '+j.evaluations.length+' entrées ?')){save(j.evaluations);render()}}catch(e){alert('Fichier de sauvegarde invalide')}}fetch('sessions.json').then(r=>r.json()).then(x=>{sessions=x;render()}).catch(()=>{document.getElementById('app').innerHTML='<p class="error">Impossible de charger les séances. Ouvre l’application via un hébergement web.</p>'});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
